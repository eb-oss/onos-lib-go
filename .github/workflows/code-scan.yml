name: Code scan workflow

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check version
        run: make check-version
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
      - name: golang-lint
        run: make lint
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check license
        run: make license
  fossa-check:
    uses: onosproject/.github/.github/workflows/fossa-scan.yml@main
